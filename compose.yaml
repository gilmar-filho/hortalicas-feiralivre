services:
  nucleo:
    build: ./servicos/nucleo
    environment:
      PRODUCAO_URL: http://producao:8082
      ENTREGA_URL: http://entrega:8083
    volumes:
      - nucleo-dados:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  producao:
    build: ./servicos/producao
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - producao-dados:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  entrega:
    build: ./servicos/entrega
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - entrega-dados:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      nucleo:
        condition: service_started
      producao:
        condition: service_started
      entrega:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  nucleo-dados:
  producao-dados:
  entrega-dados:
  rabbitmq-dados:
