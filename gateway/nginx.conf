server {
    listen 80;

    # Resolve os nomes a cada requisição: o gateway sobe com um serviço fora
    # e volta a alcançá-lo quando ele é recriado com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nucleo   http://nucleo:8081;
    set $producao http://producao:8082;
    set $entrega  http://entrega:8083;

    location /api/produtos {
        proxy_pass $producao;
    }

    location /api/retiradas {
        proxy_pass $entrega;
    }

    location /api/ {
        proxy_pass $nucleo;
    }

    location /interno {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
