spring.application.name=feira-livre-entrega
spring.datasource.url=jdbc:sqlite:./data/entrega.db?transaction_mode=IMMEDIATE
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.port=8083
server.error.include-message=always
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
mensageria.relay.ativo=${MENSAGERIA_RELAY_ATIVO:true}
mensageria.relay.intervalo-ms=${MENSAGERIA_RELAY_INTERVALO_MS:1000}
